[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-review-assistant"
version = "0.1.0"
description = "Summarises relevant HCI and AI papers for a given research topic with citation scaffolding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kostas Kazakos", email = "kgkazakos@gmail.com" }]
keywords = ["ux-research", "literature-review", "hci", "cpr", "computational-product-research", "citation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "litellm>=1.40",
    "dspy-ai>=2.4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
lit-review-assistant = "lit_review_assistant.cli:cli"

[project.urls]
Homepage = "https://github.com/kgkazakos/lit-review-assistant"
Repository = "https://github.com/kgkazakos/lit-review-assistant"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
